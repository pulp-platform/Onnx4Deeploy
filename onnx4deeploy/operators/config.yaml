# Default operator test configurations

# Sub operator configuration
sub:
  input_shape: [1, 64, 32, 32]  # NCHW format
  opset_version: 14

# Selu operator configuration
selu:
  input_shape: [1, 64, 32, 32]  # NCHW format
  opset_version: 13
  # Note: alpha and gamma use ONNX default values

# Conv2D with asymmetric padding test - LARGE VERSION for tiling
# This will trigger tiling due to memory constraints
conv2d:
  input_shape: [1, 2, 16, 16]  # NCHW: batch=1, channels=2, height=16, width=16
  kernel_size: 3
  stride: 1
  padding: [1, 2, 1, 2]  # [top, left, bottom, right] - asymmetric!
  out_channels: 2
  use_bias: false
  group: 1
  dilation: 1

# Concat with 3 inputs
concat:
  num_inputs: 3
  axis: 1  # Concatenate along channel dimension
  base_shape: [1, 4, 8, 8]  # NCHW: each input has 4 channels, output will have 12 channels

# SoftmaxCrossEntropyLoss dual-output variant (loss + log_prob)
softmax_cross_entropy_dual_output:
  input_shape: [1, 10]   # [batch, num_classes]
  opset_version: 13

# InPlaceAccumulatorV2 operator configuration (com.microsoft)
# Gradient accumulation with lazy reset:
#   if lazy_reset_grad: out = gradient           (reset)
#   else:               out = buffer + gradient   (accumulate)
inplace_accumulator_v2:
  weight_shape: [128, 784]  # Typical MLP weight shape (hidden_size, input_size)
  test_reset: true           # true = test reset mode, false = test accumulate mode

# ── Gradient operator configurations ──────────────────────────────────────────

relugrad:
  input_shape: [1, 4, 8, 8]

averagepoolgrad:
  input_grad_shape: [1, 4, 4, 4]       # [N, C, Ho, Wo] — downstream gradient
  original_input_shape: [1, 4, 8, 8]   # [N, C, Hi, Wi] — shape of original input
  kernel_shape: [2, 2]
  strides: [2, 2]
  pads: [0, 0, 0, 0]
  count_include_pad: 0
  ceil_mode: 0

# ConvGradXW (combined dX + dW, no bias — 2 outputs)
convgradxw:
  output_grad_shape: [1, 4, 2, 2]   # dY [N, Cout, Ho, Wo]  (no padding: (4-3)/1+1=2)
  input_shape: [1, 2, 4, 4]         # X  [N, Cin,  Hi, Wi]
  weight_shape: [4, 2, 3, 3]        # W  [Cout, Cin, kH, kW]
  input_grad_shape: [1, 2, 4, 4]    # dX [N, Cin,  Hi, Wi]
  weight_grad_shape: [4, 2, 3, 3]   # dW [Cout, Cin, kH, kW]
  kernel_shape: [3, 3]
  strides: [1, 1]
  pads: [0, 0, 0, 0]
  dilations: [1, 1]
  group: 1

# ConvGradXW with asymmetric padding — tests H/W padding correctness
# X=[1,2,4,4], W=[4,2,3,3], pads=[top=1, left=0, bottom=2, right=1], stride=1
# Ho = (4+1+2-3)/1+1 = 5,  Wo = (4+0+1-3)/1+1 = 3
convgradxw_padded:
  output_grad_shape: [1, 4, 5, 3]   # dY [N, Cout, Ho, Wo]
  input_shape: [1, 2, 4, 4]         # X  [N, Cin,  Hi, Wi]
  weight_shape: [4, 2, 3, 3]        # W  [Cout, Cin, kH, kW]
  input_grad_shape: [1, 2, 4, 4]    # dX (same as X)
  weight_grad_shape: [4, 2, 3, 3]   # dW (same as W)
  kernel_shape: [3, 3]
  strides: [1, 1]
  pads: [1, 0, 2, 1]                # [top, left, bottom, right] asymmetric
  dilations: [1, 1]
  group: 1

# ConvGradXWB (combined dX + dW + dB, with bias — 3 outputs)
convgradxwb:
  output_grad_shape: [1, 4, 4, 4]   # dY [N, Cout, Ho, Wo]
  input_shape: [1, 2, 4, 4]         # X  [N, Cin,  Hi, Wi]
  weight_shape: [4, 2, 3, 3]        # W  [Cout, Cin, kH, kW]
  input_grad_shape: [1, 2, 4, 4]    # dX [N, Cin,  Hi, Wi]
  weight_grad_shape: [4, 2, 3, 3]   # dW [Cout, Cin, kH, kW]
  kernel_shape: [3, 3]
  strides: [1, 1]
  pads: [1, 1, 1, 1]
  dilations: [1, 1]
  group: 1

layernormgrad:
  input_shape: [1, 8, 64]
  axis: -1
  epsilon: 0.00001
  stash_type: 1

softmax_grad:
  input_shape: [1, 10]
  axis: -1

# GroupNormGrad merged node (GradXStat + GradX + GradW + GradB fused)
groupnormgrad:
  input_shape: [2, 8, 4, 4]   # [N, C, H, W]
  num_groups: 4
  epsilon: 0.001

# GroupNorm gradient operators (individual nodes)
groupnormgradx:
  input_shape: [1, 8, 1, 64]
  num_groups: 1
  epsilon: 0.001

groupnormgradw:
  input_shape: [1, 8, 1, 64]
  num_groups: 1
  epsilon: 0.001

groupnormgradb:
  input_shape: [1, 8, 1, 64]
  num_groups: 1
  epsilon: 0.001

# GeluGrad (com.microsoft training op)
gelugrad:
  input_shape: [1, 64]

# MaxPoolGrad
maxpoolgrad:
  input_grad_shape: [1, 4, 4, 4]       # [N, C, Ho, Wo]
  original_input_shape: [1, 4, 8, 8]   # [N, C, Hi, Wi]
  kernel_shape: [2, 2]
  strides: [2, 2]
  pads: [0, 0, 0, 0]
  ceil_mode: 0

# NE16 (GAP9 HWPE) requantized conv benchmarks -- one per native kernel mode.
# c_in multiple of 16 (TP_IN), c_out multiple of 32 (TP_OUT, 16 for depthwise)
# keeps the MAC array fully fed; see the NE16 architecture notes.
ne16_rqs_conv2d:
  defaults:
    log2d: 16          # RequantShift div = 2**log2d
    signed: 1          # int8 output; the INPUT is always unsigned (NE16 has no
                       # signed-input flag in CONFIG0)
  modes:
    dense:             # CONV3x3, group == 1 -- NE16's sweet spot
      c_in: 64
      c_out: 64
      height: 32
      width: 32
    dw:                # CONV3x3_DW, group == c_in == c_out
      c_in: 128
      c_out: 128
      height: 32
      width: 32
    pw:                # CONV1x1, group == 1
      c_in: 256
      c_out: 128
      height: 16
      width: 16
