name: CI

"on":
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

jobs:
  # Quick check - package installation
  install-check:
    name: Verify Package Installation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev]"

    - name: Verify installation
      run: |
        python -c "import onnx4deeploy; print(f'Version: {onnx4deeploy.__version__}')"
        python -c "import onnx4deeploy.core; print('✓ core')"
        python -c "import onnx4deeploy.operators; print('✓ operators')"
        python -c "import onnx4deeploy.models; print('✓ models')"
        python -c "import onnx4deeploy.optimization; print('✓ optimization')"

  test-operators:
    name: Test Operators
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev]"

    - name: Run operator tests
      run: |
        python -m pytest tests/operators/ -v

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: operators
        name: operator-tests
        fail_ci_if_error: false

  test-core:
    name: Test Core Module
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev]"

    - name: Run core tests
      run: |
        python -m pytest tests/core/ -v

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: core
        name: core-tests
        fail_ci_if_error: false

  test-models:
    name: Test Models
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev]"

    - name: Run model tests (fast, random data)
      run: |
        python -m pytest tests/models/ -v -m "not slow"

    - name: Run SimpleMLP MNIST training test
      run: |
        python -m pytest tests/models/test_simplemlp.py::TestSimpleMlpTraining::test_simplemlp_training_mnist -v

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: models
        name: model-tests
        fail_ci_if_error: false

  linting:
    name: Linting and Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit (all files)
        env:
          # pretty-format-yaml fails in CI due to missing pkg_resources (setuptools not pre-installed
          # in GitHub Actions venvs). YAML formatting is still enforced locally via pre-commit.
          SKIP: pretty-format-yaml
        run: |
          # Show diffs on failure and run across the entire repository to ensure consistency
          pre-commit run --show-diff-on-failure --all-files

      - name: Show git status (debug)
        if: ${{ always() }}
        run: git status --porcelain || true
