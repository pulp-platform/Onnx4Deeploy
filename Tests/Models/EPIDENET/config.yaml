epidenet:
  pretrained: False        # Path to pretrained model or False
  C: 2                    # Number of EOG channels (16 for vertical + horizontal EOG)
  T: 1000                  # Number of time samples (1000 = 2 seconds at 500Hz)
  N: 11                    # Number of classes (11 EOG movement types)
  p_dropout: 0.0           # Dropout probability (0.0 = no dropout)
  batch_size: 1            # Batch size for ONNX export
  opset_version: 12        # ONNX opset version

training:
  learning_rate: 0.001     # Learning rate for SGD optimizer
