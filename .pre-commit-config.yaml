# Pre-commit hooks for Onnx4Deeploy
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.5.0
  hooks:
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
  - id: end-of-file-fixer
  - id: check-yaml
    args: [--unsafe]
  - id: check-added-large-files
    args: [--maxkb=1000]
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: detect-private-key

  # Python code formatting with black
- repo: https://github.com/psf/black
  rev: 24.1.1
  hooks:
  - id: black
    language_version: python3.10
    args: [--line-length=100]

  # Python import sorting with isort
- repo: https://github.com/pycqa/isort
  rev: 5.13.2
  hooks:
  - id: isort
    args: [--profile=black, --line-length=100]

  # Remove unused imports and variables
- repo: https://github.com/PyCQA/autoflake
  rev: v2.2.1
  hooks:
  - id: autoflake
    args:
    - --in-place
    - --remove-all-unused-imports
    - --remove-unused-variables
    - --ignore-init-module-imports

  # Python linting with flake8
- repo: https://github.com/pycqa/flake8
  rev: 7.0.0
  hooks:
  - id: flake8
    args:
    - --max-line-length=100
    - --extend-ignore=E203,W503,E501,F821,F841,E722,F402,F541,F403,F401,D107,D102,D200,D401,D400,D205,D103,D105,D100,D101,D104,D202,D403,D301,B027,B007,B001,B026,B006
    - --exclude=.git,__pycache__,build,dist,legacy
    additional_dependencies:
    - flake8-docstrings
    - flake8-bugbear

  # Check for common Python issues
- repo: https://github.com/pre-commit/pygrep-hooks
  rev: v1.10.0
  hooks:
  - id: python-check-blanket-noqa
  - id: python-check-blanket-type-ignore
  # Skipping python-no-eval because it conflicts with PyTorch's model.eval()
  # - id: python-no-eval
  - id: python-use-type-annotations

  # YAML formatting
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.12.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
    exclude: ^\.github/workflows/

- repo: local
  hooks:
  - id: reuse
    name: Check SPDX License Headers
    entry: scripts/reuse_skip_wrapper.py
    additional_dependencies: [reuse==6.2.0]
    language: python
    stages: [pre-commit, pre-merge-commit, pre-push, manual]
    types: [text]
    exclude_types: [batch, svg, json, markdown]

# CI-specific configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
