averagepoolgrad:
  # Input gradient shape (batch, channels, height, width) - output shape from forward pass
  input_grad_shape: [1, 3, 2, 2]

  # Original input shape (what we're computing gradient for)
  original_input_shape: [1, 3, 4, 4]

  # Pooling parameters (same as forward pass)
  kernel_shape: [2, 2]
  strides: [2, 2]
  pads: [0, 0, 0, 0]  # [top, left, bottom, right]
  count_include_pad: 0
  ceil_mode: 0

  # ONNX opset version
  opset_version: 13
