groupnormgradw:
  # Input/output shapes for GroupNormGradW with H=2
  # Testing EPIDENET layer_norm3 scenario: input [N=1, C=16, H=2, W=20]
  # Output shape: [C] (gradient for gamma)
  input_shape: [1, 16, 2, 20]     # [N, C, H, W] - H=2 like EPIDENET layer_norm3
  num_groups: 1                    # Number of groups (1 = LayerNorm behavior)
  epsilon: 0.001                   # Small constant for numerical stability
  opset_version: 13
