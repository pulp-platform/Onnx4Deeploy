convgradx:
  input_grad_shape: [1, 4, 4, 4]        # 输出梯度 shape (NCHW format)
  input_data_shape: [1, 4, 4, 4]        # 原始输入数据 shape (NCHW format)
  weight_shape: [4, 1, 3, 3]            # 权重 shape (output_ch, input_ch_per_group, kH, kW)
  kernel_shape: [3, 3]
  strides: [1, 1]
  pads: [1, 1, 1, 1]                    # top, left, bottom, right
  dilations: [1, 1]
  group: 4
  opset_version: 13
