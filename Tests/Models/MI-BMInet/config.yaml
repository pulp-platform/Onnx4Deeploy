mi_bminet:
  pretrained: False
  F1: 8           # Number of temporal filters
  D: 2            # Depth multiplier for depthwise convolution
  F2: null        # Number of pointwise filters (if null, F2 = F1*D)
  C: 8            # Number of EEG channels
  T: 256          # Number of time samples 2000
  N: 4            # Number of classes
  Nf: 64          # Feature dimension after first conv
  Nf2: 16         # Feature dimension after second conv
  activation: relu
  batch_size: 1
  opset_version: 12

training:
  learning_rate: 0.01
