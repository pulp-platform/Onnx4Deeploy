# Pointwise Convolution (1x1) Weight Gradient
convgradw:
  # output_grad_shape: [1, 32, 14, 14]     # (N, C_out, H_out, W_out)
  # input_shape:       [1, 16, 14, 14]     # (N, C_in, H_in, W_in) - same H,W as output for 1x1 conv
  # weight_grad_shape: [32, 16, 1, 1]      # (C_out, C_in, 1, 1) - pointwise kernel
  # kernel_shape: [1, 1]                    # 1x1 kernel for pointwise conv
  # strides: [1, 1]
  # pads: [0, 0, 0, 0]                      # no padding needed for 1x1
  # dilations: [1, 1]
  # group: 1                                # standard convolution (not depthwise)
  # opset_version: 13

# Depthwise Convolution Weight Gradient
# convgradw:
# convgradw:
  output_grad_shape: [1, 8, 64, 64]     # (N, C_out, H_out, W_out)
  input_shape:       [1, 8, 64, 64]     # (N, C_in, H_in, W_in)
  weight_grad_shape: [8, 1, 3, 3]       # (C_out, C_in/group, kH, kW)
  kernel_shape: [3, 3]
  strides: [1, 1]
  # 修正点 1：为了匹配 64->64 的尺寸，必须设置为 Same Padding
  # ONNX 中 pads 的顺序通常是 [top, left, bottom, right]
  pads: [1, 1, 1, 1]                    
  dilations: [1, 1]
  group: 8                              # Depthwise 模式正确
  opset_version: 13


# convgradw:
#   output_grad_shape: [1, 16, 14, 14]     # (N, C_out, H_out, W_out)
#   input_shape:       [1, 16, 16, 16]     # (N, C_in, H_in, W_in)
#   weight_grad_shape: [16, 16, 3, 3]       # (C_out, C_in/group, kH, kW)
#   kernel_shape: [3, 3]
#   strides: [1, 1]
#   pads: [0, 0, 0, 0]                      # same padding
#   dilations: [1, 1]
#   group: 1                                # depthwise: group == C_in == C_out
#   opset_version: 13

